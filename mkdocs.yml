site_name: Бази даних в інформаційних системах
site_description: Матеріали лекцій і практичних занять курсу
site_author: Анатолій Куротич, Роман Боба

# Старі версії сторінок (правило _to_delete) не публікуються
exclude_docs: |
  _to_delete/

theme:
  name: material
  language: uk
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Темна тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Світла тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Курс: index.md
  - Лекції:
      - "Модуль 1. Основи баз даних і моделювання (SQLite)":
          - "1. Вступ. Що таке база даних? Архітектура СУБД. Типи баз даних": lectures/01-vstup.md
          - "2. Створення бази даних у SQLite: CLI, SQLiteBrowser. Типи даних": lectures/02-sqlite-create.md
          - "3. Вибірка даних з таблиць: SELECT, LIMIT, WHERE, NOT NULL": lectures/03-select.md
          - "4. Рівні проєктування баз даних. ER-діаграми": lectures/04-er-modeling.md
          - "5. Вставка даних (INSERT). Первинні та зовнішні ключі": lectures/05-insert-keys.md
          - "6. Обмеження цілісності даних (NOT NULL, UNIQUE, CHECK, DEFAULT) та оновлення й видалення записів (UPDATE, DELETE)": lectures/06-constraints.md
      - "Модуль 2. Розширені запити та аналіз даних у SQL (SQLite)":
          - "7. Об'єднання таблиць: INNER, LEFT, RIGHT, CROSS JOIN": lectures/07-joins.md
          - "8. Агрегатні функції: AVG, COUNT, MIN, MAX, SUM": lectures/08-aggregate-functions.md
          - "9. Групування даних (GROUP BY). Відбір груп (HAVING)": lectures/09-group-by.md
          - "10. Сортування та фільтрація: ORDER BY, DISTINCT, BETWEEN, IN, LIKE": lectures/10-sorting-filtering.md
          - "11. Запити форматування таблиць": lectures/11-formatting-queries.md
      - "Модуль 3. Транзакції, індекси та оптимізація запитів, імпорт даних (SQLite)":
          - "12. Транзакції у SQLite: BEGIN, COMMIT, ROLLBACK. Принципи ACID. Управління блокуваннями": lectures/12-transactions.md
          - "13. Індекси в SQLite. Оптимізація запитів, EXPLAIN": lectures/13-indexes.md
          - "14. Згенеровані стовпці: VIRTUAL і STORED": lectures/14-generated-columns.md
      - "Модуль 4. Розширені можливості PostgreSQL":
          - "15. Перехід до PostgreSQL. Використання PgAdmin": lectures/15-postgres-intro.md
          - "16. Подання (Views) і матеріалізовані подання (Materialized Views)": lectures/16-views.md
          - "17. Функції у PostgreSQL": lectures/17-functions.md
          - "18. Тригери (Triggers) у PostgreSQL": lectures/18-triggers.md
  - Практичні:
      - "Модуль 1. Основи баз даних і моделювання (SQLite)":
          - "1. Створення бази даних у SQLite": practice/01-sqlite-create.md
          - "2. Формування запитів вибірки у SQLite": practice/02-select.md
          - "3. Створення ER-діаграм для заданих прикладів": practice/03-er-modeling.md
          - "4. Додавання записів, встановлення ключів і зв'язків": practice/04-insert-keys.md
          - "5. Обмеження цілісності даних: NOT NULL, UNIQUE, CHECK, DEFAULT": practice/05-constraints.md
          - "6. Робота з командами оновлення та видалення у SQLite": practice/06-update-delete.md
      - "Модуль 2. Розширені запити та аналіз даних у SQL (SQLite)":
          - "7. Запити з різними видами об'єднання таблиць у SQLite": practice/07-joins.md
          - "8. Застосування агрегатних функцій": practice/08-aggregate-functions.md
          - "9. Формування запитів з групуванням даних": practice/09-group-by.md
          - "10. Відбір груп за допомогою HAVING": practice/10-having.md
          - "11. Комбіновані завдання з групуванням та відбором даних": practice/11-combined-tasks.md
          - "12. Сортування та фільтрація даних": practice/12-sorting-filtering.md
          - "13. Форматування таблиць": practice/13-formatting-queries.md
      - "Модуль 3. Транзакції, індекси та оптимізація запитів, імпорт даних (SQLite)":
          - "14. Створення та відкат транзакцій у SQLite": practice/14-transactions.md
          - "15. Створення індексів та аналіз ефективності запитів": practice/15-indexes.md
          - "16. Імпорт даних з CSV в SQLite": practice/16-csv-import.md
          - "17. Виконання завдань з імпорту даних із CSV у SQLite": practice/17-csv-import-2.md
          - "18. Створення та використання згенерованих стовпців у SQLite": practice/18-generated-columns.md
      - "Модуль 4. Розширені можливості PostgreSQL":
