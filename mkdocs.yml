site_name: Бази даних в інформаційних системах
site_description: Матеріали лекцій і практичних занять курсу
site_author: Анатолій Куротич, Роман Боба

theme:
  name: material
  language: uk
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Темна тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Світла тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Курс: index.md
  - Лекції:
      - "Модуль 1. Основи баз даних і моделювання (SQLite)":
          - "1. Вступ. Що таке база даних? Архітектура СУБД. Типи баз даних": lectures/01-vstup.md
          - "2. Створення бази даних у SQLite: CLI, SQLiteBrowser. Типи даних": lectures/02-sqlite-create.md
          - "3. Вибірка даних з таблиць: SELECT, LIMIT, WHERE, NOT NULL": lectures/03-select.md
          - "4. Рівні проєктування баз даних. ER-діаграми": lectures/04-er-modeling.md
          - "5. Вставка даних (INSERT). Первинні та зовнішні ключі": lectures/05-insert-keys.md
          - "6. Обмеження цілісності даних: NOT NULL, UNIQUE, CHECK, DEFAULT": lectures/06-constraints.md
          - "7. Оновлення і видалення записів: UPDATE, DELETE": lectures/07-update-delete.md
      - "Модуль 2. Розширені запити та аналіз даних у SQL (SQLite)":
          - "8. Об'єднання таблиць: INNER, LEFT, RIGHT, CROSS JOIN": lectures/08-joins.md
          - "9. Агрегатні функції: AVG, COUNT, MIN, MAX, SUM": lectures/09-aggregate-functions.md
          - "10. Групування даних (GROUP BY)": lectures/10-group-by.md
          - "11. Відбір груп (HAVING)": lectures/11-having.md
          - "12. Сортування та фільтрація: ORDER BY, DISTINCT, BETWEEN, IN, LIKE": lectures/12-sorting-filtering.md
          - "13. Запити форматування таблиць": lectures/13-formatting-queries.md
      - "Модуль 3. Транзакції, індекси та оптимізація запитів, імпорт даних (SQLite)":
          - "14. Принципи ACID і необхідність транзакцій": lectures/14-acid.md
          - "15. Транзакції у SQLite: BEGIN, COMMIT, ROLLBACK": lectures/15-transactions.md
          - "16. Індекси в SQLite. Оптимізація запитів, EXPLAIN": lectures/16-indexes.md
          - "17. Імпорт даних: CSV → SQLite": lectures/17-csv-import.md
          - "18. Згенеровані стовпці: VIRTUAL і STORED": lectures/18-generated-columns.md
      - "Модуль 4. Розширені можливості PostgreSQL":
          - "19. Перехід до PostgreSQL. Використання PgAdmin": lectures/19-postgres-intro.md
          - "20. Подання (Views) і матеріалізовані подання (Materialized Views)": lectures/20-views.md
          - "21. Функції у PostgreSQL": lectures/21-functions.md
          - "22. Процедури у PostgreSQL": lectures/22-procedures.md
          - "23. Тригери (Triggers) у PostgreSQL": lectures/23-triggers.md
